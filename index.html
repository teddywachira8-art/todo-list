<!DOCTYPE html>
<html>
    <head>
        <style>
            p{
                font-family: Arial;
            }
            .title{
                border:solid green;
                padding-bottom: 20px;
            }
            
            .header{
             font-size:20px;
             font-weight:bold;
             display: flex;
             justify-content: center;
            
            }
            .icon{
                height:40px;
            
            }
            .image{
                display: flex;
                justify-content: center;
            }
            .task{
                background-color: green;
                color:white;
                padding-top:10px;
                padding-bottom: 10px;
                padding-right:20px;
                padding-left:20px;
                border: none;
                cursor:pointer;
            }
            .task:active{
                opacity:0.5;
            }
            .input{
                width:300px;
                margin-top:10px;
                height: 20px;
            
        
            }
            .search{
                display: flex;
                flex-direction: row;
                justify-content: center;
                gap:30px;
            }
            .main{
                display: flex;
                flex-direction: row;
                align-items: center;
                margin-top:20px;
                justify-content: space-between;
                border:1px solid gray;
                padding:5px;
                border-radius:5px;
            }
            .check-2{
                margin-top: 20px;
                padding:10px 20px;
                display: flex;
                align-items: center;
            }
            .pen{
                height: 20px;
                border:solid grey 1px;
            }
            .bin{
                 height: 20px;
                border:solid grey 1px;
            }
            .container-2{
                 display: flex;
                justify-content: space-between;
                gap:10px;
                
            }
            .container{
                display: flex;
                justify-content: space-between;
                gap:10px;
                
            }
            .last{
                display: flex;
                justify-content: center;
            }
            .border{
                border: solid green;
                padding:10px;
            }
            
        </style>
    </head>
    <body>
        <header class="title" >
           <h1 class="header">MY TO-DO LIST </h1>

           <div class="image">
           <img class="icon" src="icon/notebook-icon.png">
           </div>

           <div class="search">
            <input class="input" type="text" placeholder="Enter a new task...">
            <div>
            <button class="task">
                Add Task
            </button>
            </div>
           </div>
           
        </header>
                 <div class="border">
        
            <main class="main">
               
                <div class="container-2">
                    &#9989;

             <del>
                LearnJavaScript
             </del> 
                </div>

             <div class="container">
             <img class="pen" src="icon/pen.icon.png">
             <img class="bin" src="icon/bin.icon.png">

             </div>
             
    
            
        </main>

          <main class="main">
               
                <div class="container-2">
                &#9744;

             
                Build portfolio
             
                </div>

             <div class="container">
             <img class="pen" src="icon/pen.icon.png">
             <img class="bin" src="icon/bin.icon.png">

             </div>
             
    
            
        </main>
 <main class="main">
               
                <div class="container-2">
                    &#9989;

             <del>
                Practice CSS Grid
             </del> 
                </div>

             <div class="container">
             <img class="pen" src="icon/pen.icon.png">
             <img class="bin" src="icon/bin.icon.png">

             </div>
             
    
            
        </main>

        <main class="main">
               
                <div class="container-2">
                &#9744;

             
                Read a book
             
                </div>

             <div class="container">
             <img class="pen" src="icon/pen.icon.png">
             <img class="bin" src="icon/bin.icon.png">

             </div>
             
    
            
        </main>

         <main class="main">
               
                <div class="container-2">
                &#9744;

             
                Go to the gym
             
                </div>

             <div class="container">
             <img class="pen" src="icon/pen.icon.png">
             <img class="bin" src="icon/bin.icon.png">

             </div>
             
    
            
        </main>

        <div class="last">
            You have 3 tasks remaining
        </div>
                 </div>
    </body>
</html>
